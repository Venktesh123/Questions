name: Build and deploy Python app to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: concrete-tech-question-agent    # set this to your Azure Web App name
  PYTHON_VERSION: '3.10'                             # set this to the Python version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Create necessary files for Azure deployment
      - name: Create deployment files
        run: |
          # Create .deployment file
          echo "[config]" > .deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT=true" >> .deployment
          
          # Make run.bat executable
          echo "@echo off" > run.bat
          echo "cd /d \"%~dp0\"" >> run.bat
          echo "call %HOME%\site\wwwroot\.venv\Scripts\activate.bat" >> run.bat
          echo "streamlit run app.py --server.port %HTTP_PLATFORM_PORT%" >> run.bat
          
          # Ensure .streamlit directory exists
          mkdir -p .streamlit
          echo "[server]" > .streamlit/config.toml
          echo "enableCORS = false" >> .streamlit/config.toml
          echo "enableXsrfProtection = false" >> .streamlit/config.toml
          echo "" >> .streamlit/config.toml
          echo "[browser]" >> .streamlit/config.toml
          echo "gatherUsageStats = false" >> .streamlit/config.toml

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
